# Render Blueprint for Micro-Loan Calculator PWA

services:
  - type: web
    name: micro-loan-api
    runtime: node
    region: oregon
    plan: free
    rootDir: Project_1/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: DB_PATH
        value: ./data/microloan.db

  - type: web
    name: micro-loan-pwa
    runtime: static
    rootDir: Project_1/micro-loan-pwa
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
