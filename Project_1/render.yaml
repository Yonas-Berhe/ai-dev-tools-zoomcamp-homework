# Render Blueprint for Micro-Loan Calculator PWA
# https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: micro-loan-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false  # Set this manually to your frontend URL after deployment
      - key: DB_PATH
        value: /opt/render/project/src/data/microloan.db
    disk:
      name: micro-loan-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  # Frontend Static Site
  - type: web
    name: micro-loan-pwa
    runtime: static
    region: oregon
    plan: free
    rootDir: micro-loan-pwa
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this to your backend URL after deployment
