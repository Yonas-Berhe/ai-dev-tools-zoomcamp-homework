# Docker Compose for Micro-Loan Calculator PWA
# Runs both frontend and backend services locally

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: micro-loan-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:8080,http://localhost:3000
      - DB_PATH=/app/data/microloan.db
    volumes:
      # Persist database data
      - micro-loan-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - micro-loan-network

  # Frontend Service
  frontend:
    build:
      context: ./micro-loan-pwa
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3001/api
    container_name: micro-loan-pwa
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - micro-loan-network

# Named volume for database persistence
volumes:
  micro-loan-data:
    driver: local

# Network for service communication
networks:
  micro-loan-network:
    driver: bridge
